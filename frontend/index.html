<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fbfaf6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)" />
  <title>AprendeLab</title>
  <script>
    // Apply the saved theme (or the system preference) before first paint: no flash.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("aprendelab_theme"); } catch (e) {}
      var dark = saved === "dark" || (saved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <a href="#app-view" class="skip-link">Saltar al contenido</a>
  <div class="app-frame">
    <header class="topbar">
      <div class="topbar-inner">
        <a href="#/" class="brand" aria-label="AprendeLab, ir a Hoy">
          <img src="/icon.svg" alt="" class="brand-mark" />
          <span class="brand-wordmark">Aprende<span class="brand-serif">Lab</span></span>
        </a>

        <nav class="top-nav" aria-label="Secciones">
          <a href="#/" class="top-link" data-nav="hoy">Hoy</a>
          <a href="#/ingreso" class="top-link" data-nav="ingreso">Ingreso</a>
          <a href="#/aprender" class="top-link" data-nav="aprender">Aprender</a>
          <a href="#/review" class="top-link" data-nav="review">Repaso <span class="nav-count" data-due-pill hidden>0</span></a>
          <a href="#/ejercicios" class="top-link" data-nav="ejercicios">Ejercicios</a>
          <a href="#/labs" class="top-link" data-nav="labs">Laboratorios</a>
        </nav>

        <div class="top-actions">
          <button id="cmd-trigger" class="icon-btn" type="button" title="Buscar (Ctrl K)" aria-label="Buscar"></button>
          <button id="menu-trigger" class="icon-btn" type="button" title="Más opciones" aria-label="Más opciones" aria-haspopup="true" aria-expanded="false"></button>
          <a href="#/session" class="btn btn-primary btn-sm nav-cta">Sesión guiada</a>
        </div>
      </div>
    </header>

    <main id="app-view" class="page-container" tabindex="-1">
      <div class="loading-box">Cargando…</div>
    </main>

    <nav class="mobile-nav" aria-label="Navegación" id="mobile-nav"></nav>
  </div>

  <!-- Outside the header on purpose: the header's backdrop-filter would trap position:fixed -->
  <div id="menu-pop" class="menu-pop" role="menu" hidden></div>
  <div id="cmd-modal" class="cmd-backdrop" hidden></div>
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
